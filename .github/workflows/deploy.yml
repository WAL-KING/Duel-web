name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm run data
      - name: Traduction française des cartes
        run: node scripts/translate-cards.mjs || echo "Traduction ignorée (API indisponible)"
      - run: rm -f public/data/cards.en.json
      - run: npm run windbot
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ai -- 3
      - run: npm run test:ai -- 3 windbot
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
